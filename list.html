<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CraftConnect — Live Marketplace &amp; Storefront</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pattern-overlay"></div>

  <header>
    <div class="brand">
      <div class="brand-logo">CC</div>
      <div>
        <div class="brand-name">CraftConnect Catalog</div>
        <div class="brand-tagline">Verified Handcrafted Heritage &amp; Artisans</div>
      </div>
    </div>
    <div class="header-actions">
      <a href="index.html" class="nav-link-btn">＋ List New Product</a>
    </div>
  </header>

  <main style="max-width: 900px;">
    <div class="hero-card" style="padding: 20px;">
      <h2 style="font-family: Georgia, serif; font-size: 22px; margin-bottom: 4px;">Public Marketplace Catalog</h2>
      <p style="font-size: 13px; opacity: 0.9;">Products listed directly by local creators with zero middleman markups.</p>
    </div>

    <!-- Mode switch: Hyperlocal vs National -->
    <div class="mode-switch-box">
      <button class="mode-btn active" id="tab-all" onclick="filterCatalog('all')">All Items</button>
      <button class="mode-btn" id="tab-hyper" onclick="filterCatalog('hyperlocal')">📍 Nearby GPS Stores</button>
      <button class="mode-btn" id="tab-nat" onclick="filterCatalog('national')">🇮🇳 Pan-India Shipping</button>
    </div>

    <div id="catalog-container" class="feed-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));">
      <!-- Products loaded dynamically from localStorage -->
    </div>
  </main>

  <script>
    // Initial catalog seed data if local storage is empty
    const DEFAULT_CATALOG = [
      {
        id: "seed-1",
        title: "Jaipur Blue Pottery Planter",
        category: "Traditional Pottery",
        artisan: "Meera Devi",
        location: "Jaipur (1.8 km away)",
        price: "₹650",
        type: "hyperlocal",
        emoji: "🏺",
        tags: ["#JaipurArt", "#Pottery"]
      },
      {
        id: "seed-2",
        title: "Pure Cotton Flat-Weave Dhurrie",
        category: "Handloom",
        artisan: "Ramesh Prajapat",
        location: "Pan-India Post Dispatched",
        price: "₹1,450",
        type: "national",
        emoji: "🧵",
        tags: ["#Handloom", "#PureCotton"]
      }
    ];

    let currentFilter = 'all';

    function loadCatalog() {
      let stored = localStorage.getItem('craftconnect_products');
      let products = stored ? JSON.parse(stored) : DEFAULT_CATALOG;

      if (!stored) {
        localStorage.setItem('craftconnect_products', JSON.stringify(DEFAULT_CATALOG));
      }

      const container = document.getElementById('catalog-container');
      container.innerHTML = "";

      const filtered = products.filter(item => {
        if (currentFilter === 'all') return true;
        return item.type === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">No products found in this category.</div>`;
        return;
      }

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'product-item';
        div.innerHTML = `
          <div class="product-img-box">${item.image ? `<img src="${item.image}" style="width:100%;height:100%;object-fit:cover;"/>` : item.emoji}</div>
          <div class="product-info">
            <span class="product-tag">${item.type === 'hyperlocal' ? '📍 GPS TOURIST' : '🇮🇳 PARCEL'}</span>
            <div class="product-title">${item.title}</div>
            <div class="product-artisan">By ${item.artisan || 'Local Artisan'}</div>
            <div class="product-meta">${item.location}</div>
            <div class="product-bottom">
              <span class="product-price">${item.price}</span>
              <button class="btn-sm" onclick="alert('Order placed directly with ${item.artisan || 'the artisan'}!')">
                ${item.type === 'hyperlocal' ? 'Locate Store' : 'Buy Online'}
              </button>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function filterCatalog(type) {
      currentFilter = type;
      document.getElementById('tab-all').classList.toggle('active', type === 'all');
      document.getElementById('tab-hyper').classList.toggle('active', type === 'hyperlocal');
      document.getElementById('tab-nat').classList.toggle('active', type === 'national');
      loadCatalog();
    }

    window.onload = loadCatalog;
  </script>
</body>
</html>
